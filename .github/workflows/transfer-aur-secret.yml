name: Transfer AUR publishing secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: transfer AUR key to upstream
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.UPSTREAM_SECRET_ADMIN_TOKEN }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" || -z "$GH_TOKEN" ]]; then
            echo "::error::Required transfer secrets are missing."
            exit 1
          fi

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" |
            gh secret set AUR_SSH_PRIVATE_KEY \
              --repo 1Selxo/Mangatan
